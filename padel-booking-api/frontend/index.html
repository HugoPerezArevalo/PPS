<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00A862" />
  <title>PadelClub · Reserva tu pista</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300A862'/%3E%3Ccircle cx='12' cy='12' r='4' fill='white'/%3E%3Ccircle cx='20' cy='20' r='4' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#/home" aria-label="PadelClub inicio">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="9" cy="9" r="3.2"/><circle cx="15" cy="15" r="3.2"/>
            </svg>
          </span>
          <span class="brand__text">Padel<strong>Club</strong></span>
        </a>

        <nav class="mainnav" id="mainnav" aria-label="Navegación principal"></nav>

        <div class="topbar__actions" id="topbar-actions"></div>

        <button class="iconbtn burger" id="burger" aria-label="Abrir menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="app" class="app" tabindex="-1"></main>

    <footer class="footer">
      <div class="footer__inner">
        <span>PadelClub · gestión de reservas</span>
        <a id="docs-link" href="#" target="_blank" rel="noopener">Documentación de la API</a>
      </div>
    </footer>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
